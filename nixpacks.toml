[variables]
NIXPACKS_PHP_VERSION = "8.5"
NIXPACKS_NODE_VERSION = "26"

[phases.install]
cmds = [
    "curl -fsSL https://deb.nodesource.com/setup_26.x | sudo -E bash - && sudo apt-get install -y nodejs",
    "node -v && npm -v",
    "composer install --ignore-platform-reqs",
    "rm -rf node_modules package-lock.json && npm install"
]

[phases.build]
cmds = [
    'npm run build',
    'php artisan config:clear',
    'php artisan route:clear',
    'php artisan view:clear'
]

[start]
cmd =  'php artisan storage:link && php artisan serve --host=0.0.0.0 --port=8002'